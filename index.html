const DB_KEY = "labpulse_demo_db_v1";
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw) return JSON.parse(raw);
  const fresh = JSON.parse(JSON.stringify(SEED));
  localStorage.setItem(DB_KEY, JSON.stringify(fresh));
  return fresh;
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let DB = loadDB();
function resetDemoData(){ localStorage.removeItem(DB_KEY); DB = loadDB(); render(); }

function getSession(){ const raw = localStorage.getItem("labpulse_demo_session"); return raw ? JSON.parse(raw) : null; }
function setSession(user){ localStorage.setItem("labpulse_demo_session", JSON.stringify(user)); }
function clearSession(){ localStorage.removeItem("labpulse_demo_session"); }

function applyScope(user){
  switch(user.role){
    case "admin": case "operations": return {type:"all"};
    case "faculty": return {type:"department", value:user.department, ownBookingsOnly:true};
    case "student": return {type:"availability_only", value:user.department};
    case "lab_incharge": return {type:"facility_list", value:user.assigned_facility_ids||[]};
    case "maintenance": return {type:"maintenance_only"};
    default: return {type:"none"};
  }
}
function scopedFacilityIds(user){
  const scope = applyScope(user);
  if(scope.type==="all") return null;
  if(scope.type==="facility_list") return scope.value||[];
  if(scope.type==="department" || scope.type==="availability_only"){
    return DB.facilities.filter(f=>f.department===(scope.value||user.department)).map(f=>f.facility_id);
  }
  return [];
}

function hoursBetween(s,e){ return (new Date(e)-new Date(s))/3600000; }
function facilityLookup(){ return Object.fromEntries(DB.facilities.map(f=>[f.facility_id,f])); }

function utilisationReport(facilityIds){
  const scoped = facilityIds ? DB.facilities.filter(f=>facilityIds.includes(f.facility_id)) : DB.facilities;
  const bookings = DB.bookings.filter(b=>b.status==="confirmed");
  return scoped.map(f=>{
    const fBookings = bookings.filter(b=>b.facility_id===f.facility_id);
    const bookedHours = fBookings.reduce((s,b)=>s+hoursBetween(b.start_time,b.end_time),0);
    const fUsage = DB.usageLogs.filter(u=>u.facility_id===f.facility_id);
    const usedHours = fUsage.reduce((s,u)=>s+u.hours_actually_used,0);
    const utilisation_pct = bookedHours>0 ? Math.round((usedHours/bookedHours)*100) : null;
    return {facility_id:f.facility_id, facility:f.name, department:f.department, status:f.status,
      booked_hours:Math.round(bookedHours*10)/10, used_hours:Math.round(usedHours*10)/10, utilisation_pct};
  });
}

function phantomBookingReport(facilityIds){
  const lookup = facilityLookup();
  const bookings = DB.bookings.filter(b=>b.status==="confirmed");
  const scoped = facilityIds ? bookings.filter(b=>facilityIds.includes(b.facility_id)) : bookings;
  const rows = scoped.map(b=>{
    const usage = DB.usageLogs.find(u=>u.booking_id===b.booking_id);
    const bookedHours = hoursBetween(b.start_time,b.end_time);
    const usedHours = usage ? usage.hours_actually_used : 0;
    const wastedHours = Math.max(bookedHours-usedHours,0);
    let status = usedHours===0 ? "unused" : usedHours<bookedHours*0.5 ? "partially_used" : "fully_used";
    return {booking_id:b.booking_id, facility:lookup[b.facility_id]?.name, facility_id:b.facility_id,
      purpose:b.purpose, booked_hours:Math.round(bookedHours*10)/10, used_hours:Math.round(usedHours*10)/10,
      wasted_hours:Math.round(wastedHours*10)/10, status};
  });
  const totalBookedHours = rows.reduce((s,r)=>s+r.booked_hours,0);
  const totalWastedHours = rows.reduce((s,r)=>s+r.wasted_hours,0);
  const unusedCount = rows.filter(r=>r.status==="unused").length;
  return {
    summary:{total_bookings_analysed:rows.length, unused_bookings:unusedCount,
      phantom_rate_pct: rows.length>0?Math.round((unusedCount/rows.length)*100):0,
      total_wasted_hours:Math.round(totalWastedHours*10)/10, total_booked_hours:Math.round(totalBookedHours*10)/10},
    bookings: rows.filter(r=>r.status!=="fully_used")
  };
}

function rootCauseAnalysis(facilityId){
  const facility = DB.facilities.find(f=>f.facility_id===facilityId);
  if(!facility) return {error:"Facility not found"};
  const util = utilisationReport([facilityId])[0];
  const maintenance = DB.maintenance.filter(m=>m.facility_id===facilityId);
  const openTickets = maintenance.filter(m=>m.status!=="resolved");
  const phantom = phantomBookingReport([facilityId]);
  const bookings = DB.bookings.filter(b=>b.facility_id===facilityId);
  const cancelledCount = bookings.filter(b=>b.status==="cancelled").length;
  const confirmedCount = bookings.filter(b=>b.status==="confirmed").length;
  const causes = [];
  if(openTickets.length>0){
    causes.push({cause:"Maintenance problem", evidence:`${openTickets.length} unresolved issue(s): ${openTickets.map(t=>t.issue).join("; ")}`,
      recommended_action:"Prioritise resolving the open maintenance ticket(s) before reallocating this facility."});
  }
  if(phantom.summary.unused_bookings>0 && phantom.summary.phantom_rate_pct>=30){
    causes.push({cause:"Scheduling problem (high bookings, low attendance)",
      evidence:`${phantom.summary.unused_bookings} of ${phantom.summary.total_bookings_analysed} confirmed bookings had zero recorded usage (${phantom.summary.phantom_rate_pct}% phantom rate).`,
      recommended_action:"Review recurring reservations and confirm real demand before re-approving them."});
  }
  if(confirmedCount<=2 && util.utilisation_pct!==null){
    causes.push({cause:"Low demand", evidence:`Only ${confirmedCount} confirmed booking(s) found for this facility.`,
      recommended_action:"Consider promoting this facility's availability or reassigning it to a higher-demand department."});
  }
  if(cancelledCount>0){
    causes.push({cause:"Repeated cancellations", evidence:`${cancelledCount} booking(s) for this facility were cancelled.`,
      recommended_action:"Investigate whether cancellations cluster around a specific time slot or requester."});
  }
  if(causes.length===0){
    causes.push({cause:"No significant issue detected", evidence:"Utilisation, maintenance, and booking patterns all look healthy.", recommended_action:"No action needed."});
  }
  return {facility:facility.name, facility_id:facilityId, utilisation_pct:util.utilisation_pct, causes};
}

function healthScores(facilityIds){
  const scoped = facilityIds ? DB.facilities.filter(f=>facilityIds.includes(f.facility_id)) : DB.facilities;
  return scoped.map(f=>{
    const util = utilisationReport([f.facility_id])[0];
    const phantom = phantomBookingReport([f.facility_id]).summary;
    const openTickets = DB.maintenance.filter(m=>m.facility_id===f.facility_id && m.status!=="resolved").length;
    const utilisationScore = util.utilisation_pct!==null ? Math.min(util.utilisation_pct,100) : 50;
    const maintenanceFactor = Math.max(0,100-openTickets*30);
    const phantomFactor = Math.max(0,100-phantom.phantom_rate_pct);
    let score = Math.round(0.5*utilisationScore + 0.3*phantomFactor + 0.2*maintenanceFactor);
    score = Math.max(0,Math.min(100,score));
    let tier = score>=70?"healthy":score>=40?"attention_required":"critical";
    return {facility_id:f.facility_id, facility:f.name, health_score:score, tier,
      utilisation_pct:util.utilisation_pct, open_maintenance_tickets:openTickets, phantom_booking_rate_pct:phantom.phantom_rate_pct};
  });
}

function demandIntelligence(){
  const lookup = facilityLookup();
  const bookings = DB.bookings.filter(b=>b.status==="confirmed");
  const countByFacility={}, hourCounts={}, deptCounts={};
  bookings.forEach(b=>{
    countByFacility[b.facility_id]=(countByFacility[b.facility_id]||0)+1;
    const hour = new Date(b.start_time).getHours();
    hourCounts[hour]=(hourCounts[hour]||0)+1;
    const dept = lookup[b.facility_id]?.department;
    if(dept) deptCounts[dept]=(deptCounts[dept]||0)+1;
  });
  const ranked = Object.entries(countByFacility).map(([facility_id,count])=>({facility_id,facility:lookup[facility_id]?.name,bookings:count})).sort((a,b)=>b.bookings-a.bookings);
  const peakHour = Object.entries(hourCounts).sort((a,b)=>b[1]-a[1])[0];
  return {
    most_requested: ranked.slice(0,3),
    peak_hour: peakHour ? `${peakHour[0]}:00 - ${parseInt(peakHour[0])+1}:00` : "Not enough data",
    department_demand: Object.entries(deptCounts).map(([department,count])=>({department,bookings:count})).sort((a,b)=>b.bookings-a.bookings)
  };
}

function executiveInsight(){
  const phantom = phantomBookingReport();
  const util = utilisationReport();
  const worst = [...util].filter(u=>u.utilisation_pct!==null).sort((a,b)=>a.utilisation_pct-b.utilisation_pct)[0];
  const worstPhantom = worst ? phantomBookingReport([worst.facility_id]) : null;
  const overallPct = phantom.summary.total_booked_hours>0 ? Math.round((phantom.summary.total_wasted_hours/phantom.summary.total_booked_hours)*100) : 0;
  return {
    headline:`Across ${util.length} facilities, ${overallPct}% of booked hours were unused, representing approximately ${phantom.summary.total_wasted_hours} hours of potentially recoverable capacity.`,
    detail: worst ? `The largest contributor was ${worst.facility}, at ${worst.utilisation_pct}% utilisation, with ${worstPhantom.summary.unused_bookings} unused reservation(s) out of ${worstPhantom.summary.total_bookings_analysed}.` : "Not enough data yet.",
    recommendation: worst ? `Review recurring reservations for ${worst.facility} and prioritise resolving any open maintenance tickets affecting it.` : "Continue monitoring."
  };
}

function askGenie(user, question){
  const scope = applyScope(user);
  const q = question.toLowerCase();
  if(scope.type==="none") return {answer:"Your role does not have access to this data.", data:[]};

  if(q.includes("ghost") || q.includes("phantom") || q.includes("never used") || q.includes("no show")){
    if(scope.type==="availability_only") return {answer:"Ghost booking detection is not available for the student role.", data:[]};
    const rep = phantomBookingReport(scope.type==="all"?null:scopedFacilityIds(user));
    return {answer:`${rep.summary.unused_bookings} ghost booking(s) found out of ${rep.summary.total_bookings_analysed} confirmed bookings (${rep.summary.phantom_rate_pct}% phantom rate).`, data:rep.bookings};
  }
  if(q.includes("underutil") || q.includes("idle")){
    if(scope.type==="availability_only") return {answer:"Utilisation analytics are not available for the student role.", data:[]};
    const rep = utilisationReport(scope.type==="all"?null:scopedFacilityIds(user)).filter(r=>r.utilisation_pct!==null && r.utilisation_pct<20).sort((a,b)=>a.utilisation_pct-b.utilisation_pct);
    return {answer: rep.length? `${rep.length} facility(ies) in your scope are underutilised (below 20%).` : "No underutilised facilities found in your scope.", data:rep};
  }
  if(q.includes("maintenance") || q.includes("issue") || q.includes("broken") || q.includes("fault")){
    if(scope.type==="availability_only") return {answer:"Maintenance details are not available for the student role.", data:[]};
    const ids = scope.type==="all"?null:scopedFacilityIds(user);
    const rows = DB.maintenance.filter(m=>!ids || ids.includes(m.facility_id)).map(m=>({facility:facilityLookup()[m.facility_id]?.name, issue:m.issue, severity:m.severity, status:m.status}));
    return {answer: rows.length? `${rows.length} maintenance record(s) found in your scope.` : "No maintenance issues found in your scope.", data:rows};
  }
  if(q.includes("health")){
    if(scope.type==="availability_only") return {answer:"Health scores are not available for the student role.", data:[]};
    const rows = healthScores(scope.type==="all"?null:scopedFacilityIds(user));
    return {answer:`Health scores computed for ${rows.length} facility(ies) in your scope.`, data:rows};
  }
  if(q.includes("free") || q.includes("available")){
    const ids = scope.type==="all"?null:scopedFacilityIds(user);
    const rows = DB.facilities.filter(f=>(!ids||ids.includes(f.facility_id)) && f.status==="active").map(f=>{
      const active = DB.bookings.filter(b=>b.facility_id===f.facility_id && b.status==="confirmed").length;
      return {facility:f.name, facility_id:f.facility_id, upcoming_bookings:active};
    });
    return {answer:`${rows.length} facility(ies) checked for availability in your scope.`, data:rows};
  }
  if(scope.type==="availability_only") return {answer:"Only availability questions are supported for the student role.", data:[]};
  const ids = scope.type==="all"?null:scopedFacilityIds(user);
  const rows = DB.facilities.filter(f=>!ids||ids.includes(f.facility_id)).map(f=>({facility:f.name, facility_id:f.facility_id, status:f.status}));
  return {answer:"Here is a summary of facilities within your scope.", data:rows};
}

function createBooking(user, payload){
  const facility = DB.facilities.find(f=>f.facility_id===payload.facility_id);
  if(!facility) return {ok:false, msg:"Facility not found"};
  if(facility.status!=="active") return {ok:false, msg:"Facility is currently unavailable (under maintenance)"};
  const id = "B"+Math.random().toString(36).slice(2,8).toUpperCase();
  const status = ["faculty","lab_incharge","admin"].includes(user.role) ? "confirmed" : "pending";
  DB.bookings.push({booking_id:id, facility_id:payload.facility_id, requested_by:user.user_id, purpose:payload.purpose, start_time:payload.start_time, end_time:payload.end_time, status});
  saveDB(DB);
  return {ok:true, msg: status==="confirmed" ? "Booking confirmed" : "Request submitted for approval"};
}
function cancelBooking(user, bookingId){
  const b = DB.bookings.find(x=>x.booking_id===bookingId);
  if(!b) return {ok:false, msg:"Not found"};
  if(user.role!=="admin" && b.requested_by!==user.user_id) return {ok:false, msg:"Not your booking"};
  b.status="cancelled"; saveDB(DB);
  return {ok:true, msg:"Booking cancelled"};
}
function logUsage(user, payload){
  const id = "L"+Math.random().toString(36).slice(2,8).toUpperCase();
  DB.usageLogs.push({log_id:id, facility_id:payload.facility_id, booking_id:payload.booking_id||null, hours_actually_used:parseFloat(payload.hours_actually_used), headcount:parseInt(payload.headcount)});
  saveDB(DB);
  return {ok:true, msg:"Usage logged"};
}
function reportIssue(user, payload){
  const id = "T"+Math.random().toString(36).slice(2,8).toUpperCase();
  DB.maintenance.push({ticket_id:id, facility_id:payload.facility_id, issue:payload.issue, severity:payload.severity, reported_date:new Date().toISOString().slice(0,10), status:"open"});
  if(["high","critical"].includes(payload.severity)){
    const f = DB.facilities.find(x=>x.facility_id===payload.facility_id);
    if(f) f.status="under_maintenance";
  }
  saveDB(DB);
  return {ok:true, msg:"Maintenance ticket created"};
}
function updateTicketStatus(ticketId, status){
  const t = DB.maintenance.find(x=>x.ticket_id===ticketId);
  if(!t) return;
  t.status=status;
  if(status==="resolved"){
    t.resolved_date=new Date().toISOString().slice(0,10);
    const f = DB.facilities.find(x=>x.facility_id===t.facility_id);
    if(f) f.status="active";
  }
  saveDB(DB);
}

}

}

function wireGenieChat(id, user){
  const input = document.getElementById(`${id}_input`);
  const askBtn = document.getElementById(`${id}_ask`);
  const answerBox = document.getElementById(`${id}_answer`);
  function run(q){
    if(!q || !q.trim()) return;
    input.value = q;
    const result = askGenie(user, q);
    const scope = applyScope(user);
    let tableHTML = "";
    if(Array.isArray(result.data) && result.data.length>0){
      const headers = Object.keys(result.data[0]);
      tableHTML = `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>
        ${result.data.map(row=>`<tr>${headers.map(h=>`<td>${esc(row[h])}</td>`).join("")}</tr>`).join("")}
      </tbody></table>`;
    }
    answerBox.innerHTML = `
      <div class="genie-answer">
        <span class="scope-tag">Scope applied: ${esc(scope.type)}${scope.value?` (${esc(JSON.stringify(scope.value))})`:""}</span>
        <p style="margin:0 0 .6rem;">${esc(result.answer)}</p>
        ${tableHTML}
      </div>`;
  }
  askBtn.addEventListener("click", ()=>run(input.value));
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") run(input.value); });
  document.querySelectorAll(`#${id}_sugg button`).forEach(b=>b.addEventListener("click", ()=>run(b.dataset.q)));
}

  const ids = scopedFacilityIds(user);
  const list = ids ? DB.facilities.filter(f=>ids.includes(f.facility_id)) : DB.facilities;
  const icons = {active:"🟢", under_maintenance:"🟡", closed:"⚪"};
  const buildings = [...new Set(list.map(f=>f.department||"General"))];
  return `
    <h1 class="page-title">Campus Facility Map</h1>
    <p class="page-sub">🟢 Available &nbsp; 🔴 Occupied &nbsp; 🟡 Maintenance &nbsp; ⚪ Closed</p>
    ${buildings.map(b=>`
      <h2 class="section-title">${esc(b)} Block</h2>
      <div class="card-grid">
        ${list.filter(f=>(f.department||"General")===b).map(f=>`<div class="card"><h3>${icons[f.status]||"⚪"} ${esc(f.name)}</h3><p style="font-size:.8rem;color:var(--muted);margin:0;">${esc(f.type)} · Capacity ${esc(f.capacity)}</p></div>`).join("")}
      </div>`).join("")}
  `;
}

function renderAnalytics(user){
  const ids = scopedFacilityIds(user);
  const util = utilisationReport(ids);
  const phantom = phantomBookingReport(ids);
  const health = healthScores(ids);
  const isOpsAdmin = ["admin","operations"].includes(user.role);
  const insight = isOpsAdmin ? executiveInsight() : null;
  const demand = isOpsAdmin ? demandIntelligence() : null;

  return `
    <h1 class="page-title">Analytics & Utilisation Intelligence</h1>
    <p class="page-sub">Booking is an intention. Actual usage is the truth.</p>

    ${insight ? `<div class="banner"><h3>📊 Executive Insight</h3><p>${esc(insight.headline)}</p><p>${esc(insight.detail)}</p><p style="font-style:italic;">${esc(insight.recommendation)}</p></div>` : ""}

    <div class="card-grid">
      <div class="card"><div class="stat">${phantom.summary.phantom_rate_pct}%</div><div class="stat-label">Phantom booking rate</div></div>
      <div class="card"><div class="stat">${phantom.summary.total_wasted_hours}</div><div class="stat-label">Wasted booked hours</div></div>
      <div class="card"><div class="stat">${phantom.summary.unused_bookings}</div><div class="stat-label">Unused bookings</div></div>
      <div class="card"><div class="stat">${util.filter(u=>u.utilisation_pct!==null && u.utilisation_pct<20).length}</div><div class="stat-label">Underutilised facilities</div></div>
    </div>

    <h2 class="section-title">Facility Utilisation %</h2>
    <table><thead><tr><th>Facility</th><th>Booked Hrs</th><th>Used Hrs</th><th style="width:160px;">Utilisation</th><th></th></tr></thead><tbody>
      ${util.map(u=>{
        const pct = u.utilisation_pct;
        const color = pct===null?"#999":pct<30?"#b02a2a":pct<60?"#a0521d":"#1e7d55";
        return `<tr><td>${esc(u.facility)}</td><td>${u.booked_hours}</td><td>${u.used_hours}</td>
          <td><div style="display:flex;align-items:center;gap:.5rem;"><div class="bar-wrap"><div class="bar-fill" style="width:${pct||0}%;background:${color};"></div></div><span style="font-size:.78rem;">${pct??"—"}%</span></div></td>
          <td><button class="btn-primary rootCauseBtn" data-id="${u.facility_id}">Why?</button></td></tr>`;
      }).join("")}
    </tbody></table>

    <div id="rootCauseBox"></div>

    <h2 class="section-title">Facility Health Scores</h2>
    <div class="card-grid">
      ${health.map(hh=>`<div class="card"><h3>${esc(hh.facility)}</h3><div class="stat" style="color:${hh.tier==='healthy'?'#1e7d55':hh.tier==='attention_required'?'#a0521d':'#b02a2a'};">${hh.health_score}/100</div><div class="stat-label">${esc(hh.tier.replace('_',' '))}</div><p style="font-size:.75rem;color:var(--muted);margin-top:.4rem;">Utilisation: ${hh.utilisation_pct??"—"}% · Open tickets: ${hh.open_maintenance_tickets} · Phantom: ${hh.phantom_booking_rate_pct}%</p></div>`).join("")}
    </div>

    ${demand ? `
    <h2 class="section-title">Demand Intelligence</h2>
    <div class="card-grid">
      <div class="card"><h3>Most Requested</h3>${demand.most_requested.map(d=>`<p style="margin:.2rem 0;font-size:.85rem;">${esc(d.facility)} — ${d.bookings} bookings</p>`).join("")}</div>
      <div class="card"><h3>Peak Hour</h3><div class="stat">${esc(demand.peak_hour)}</div></div>
      <div class="card"><h3>Department Demand</h3>${demand.department_demand.map(d=>`<p style="margin:.2rem 0;font-size:.85rem;">${esc(d.department)} — ${d.bookings}</p>`).join("")}</div>
    </div>` : ""}

    <div class="genie-panel">${genieChatHTML("analyticsGenie")}</div>
  `;
}

function renderAdmin(user){
  return `
    <h1 class="page-title">Administration</h1>
    <p class="page-sub">Full user and facility management.</p>

    <h2 class="section-title">User Management</h2>
    <form id="userForm" class="form-row">
      <input id="uf2_name" placeholder="Full name" required />
      <input id="uf2_email" type="email" placeholder="Email" required />
      <input id="uf2_password" placeholder="Password" required />
      <select id="uf2_role">
        <option value="admin">admin</option><option value="faculty">faculty</option><option value="student">student</option>
        <option value="lab_incharge">lab_incharge</option><option value="maintenance">maintenance</option><option value="operations">operations</option>
      </select>
      <input id="uf2_department" placeholder="Department (optional)" />
      <button class="btn-primary" type="submit">Add User</button>
    </form>
    <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th><th>Action</th></tr></thead><tbody>
      ${DB.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.department||"—")}</td><td><span class="badge ${u.active?'active':'open'}">${u.active?'active':'inactive'}</span></td><td><button class="btn-primary toggleUserBtn" data-id="${u.user_id}">${u.active?'Deactivate':'Reactivate'}</button></td></tr>`).join("")}
    </tbody></table>

    <h2 class="section-title">All Maintenance Tickets</h2>
    ${maintenanceTable(DB.maintenance, true)}

    <div style="margin-top:1.5rem;">
      <span class="demo-flag">⚠ Static demo — data resets if you clear browser storage</span><br/>
      <button class="btn-primary" id="resetDataBtn">Reset demo data</button>
    </div>
  `;
}

function wirePageEvents(user){
  wireGenieChat("homeGenie", user);
  const el = id=>document.getElementById(id);

  if(el("analyticsGenie_input")) wireGenieChat("analyticsGenie", user);
  document.querySelectorAll(".rootCauseBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const rc = rootCauseAnalysis(btn.dataset.id);
      document.getElementById("rootCauseBox").innerHTML = `
        <div class="genie-panel"><h3>🔎 Root Cause: ${esc(rc.facility)}</h3>
        ${rc.causes.map(c=>`<div class="cause-block"><strong style="color:var(--navy);">${esc(c.cause)}</strong><p style="margin:.2rem 0;font-size:.85rem;color:var(--muted);">${esc(c.evidence)}</p><p style="margin:0;font-size:.85rem;font-style:italic;color:var(--teal);">→ ${esc(c.recommended_action)}</p></div>`).join("")}
        </div>`;
    });
  });

  document.querySelectorAll(".cancelBookingBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ cancelBooking(user, btn.dataset.id); renderApp(user); });
  });
  document.querySelectorAll(".ticketStartBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ updateTicketStatus(btn.dataset.id, "in_progress"); renderApp(user); });
  });
  document.querySelectorAll(".ticketResolveBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ updateTicketStatus(btn.dataset.id, "resolved"); renderApp(user); });
  });
  document.querySelectorAll(".toggleUserBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ toggleUserActive(btn.dataset.id); renderApp(user); });
  });

  if(el("bookingForm")){
    el("bookingForm").addEventListener("submit", e=>{
      e.preventDefault();
      const res = createBooking(user, {facility_id:el("bf_facility").value, purpose:el("bf_purpose").value, start_time:el("bf_start").value, end_time:el("bf_end").value});
      el("bf_msg").textContent = res.msg;
      if(res.ok) renderApp(user);
    });
  }
  if(el("usageForm")){
    el("usageForm").addEventListener("submit", e=>{
      e.preventDefault();
      logUsage(user, {facility_id:el("uf_facility").value, hours_actually_used:el("uf_hours").value, headcount:el("uf_headcount").value});
      renderApp(user);
    });
  }
  if(el("issueForm")){
    el("issueForm").addEventListener("submit", e=>{
      e.preventDefault();
      reportIssue(user, {facility_id:el("if_facility").value, issue:el("if_issue").value, severity:el("if_severity").value});
      renderApp(user);
    });
  }
  if(el("userForm")){
    el("userForm").addEventListener("submit", e=>{
      e.preventDefault();
      createUser({name:el("uf2_name").value, email:el("uf2_email").value, password:el("uf2_password").value, role:el("uf2_role").value, department:el("uf2_department").value});
      renderApp(user);
    });
  }
  if(el("resetDataBtn")) el("resetDataBtn").addEventListener("click", resetDemoData);
  if(el("searchBox")){
    el("searchBox").addEventListener("input", ()=>{
      const term = el("searchBox").value.toLowerCase();
      const ids = scopedFacilityIds(user);
      const list = (ids?DB.facilities.filter(f=>ids.includes(f.facility_id)):DB.facilities).filter(f=>f.name.toLowerCase().includes(term));
      el("facilityCards").innerHTML = list.map(f=>`<div class="card"><h3>${esc(f.name)}</h3><p style="font-size:.82rem;color:var(--muted);margin:0 0 .5rem;">${esc(f.type)} · ${esc(f.department)} · Capacity ${esc(f.capacity)}</p><span class="badge ${f.status}">${esc(f.status)}</span></div>`).join("");
    });
  }
}

render();
</script>
</body>
</html>
